<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Registrieren</title>
    <link rel="stylesheet" href="style/login.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1 id="page-title">Registrieren</h1>
                <button id="languageToggle" class="lang-switch" type="button">EN</button>
            </div>
            <p id="page-description">Bitte registrieren Sie sich mit Benutzername und Passwort.</p>
            <form id="authForm" autocomplete="on">
                <label for="username" id="label-username">Benutzername</label>
                <input id="username" name="username" type="text" autocomplete="username" required minlength="3" placeholder="Ihr Benutzername">

                <label for="password" id="label-password">Passwort</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="Mindestens 8 Zeichen">

                <button id="submitButton" type="submit">Registrieren</button>
                <p class="note">Passwörter werden lokal gehasht, bevor sie gespeichert oder geprüft werden.</p>
                <p id="message" class="message"></p>
            </form>
            <div class="toggle-row">
                <span id="toggleText" class="span">Bereits registriert?</span>
                <a href="login.html" class="button">Anmelden</a>
            </div>
            <a class="back-link" href="login.html">Zurück zum Login</a>
        </div>
    </div>
    <script src="script/userDatabase.js"></script>
    <script src="script/register.js"></script>
</body>
</html>
