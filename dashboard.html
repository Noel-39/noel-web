<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Startseite</title>
    <link rel="stylesheet" href="style/index.css">
</head>
<body>
    <div class="card">
        <a href="index.html" class="top-back-btn">← Startseite</a>
        <h1 id="dashboardTitle">Willkommen</h1>
        <p id="dashboardSubtext">Hier kannst du auf deine verfügbaren Seiten zugreifen.</p>
        <div class="menu">
            <a href="rechner.html">3D Preisrechner</a>
            <a href="impressum.html">Impressum</a>
            <a href="datenschutz.html">Datenschutz</a>
        </div>
        <button id="logoutBtn" class="login-button">Logout</button>
    </div>
    <script>
        const username = localStorage.getItem('logged_in_user');
        if (!username) {
            window.location.href = 'login.html';
        }
        document.getElementById('dashboardTitle').textContent = `Willkommen, ${username}`;
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('logged_in_user');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
