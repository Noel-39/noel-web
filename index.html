<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Noel-Web</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #121212;
            color: #c8c8c8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 15px;
            width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #262626;
            text-align: center;
        }
        h1 {
            color: #2980b9;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .menu {
            margin: 20px 0;
        }
        .menu a {
            display: inline-block;
            margin: 10px;
            padding: 15px 25px;
            background: #2ecc71;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1em;
            transition: background 0.3s;
        }
        .menu a:hover {
            background: #27ae60;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Noel-Web</h1>
        <div class="menu">
            <a href="rechner.html">3D Preisrechner</a>
            <a href="impressum.html">Impressum</a>

        </div>
    </div>
</body>
</html>
